<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>دعوة زواج</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --gold: #C9A76B;
    --gold-light: #E8D2A6;
    --gold-dim: #8f7548;
    --bg-deep: #0D2B27;
    --bg-deep-2: #0a211d;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background: var(--bg-deep);
    overflow:hidden;
    font-family:'Tajawal', sans-serif;
  }
  body{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    color: var(--gold-light);
  }

  /* ---------- Background texture ---------- */
  .bg-layer{
    position:fixed; inset:0; z-index:0; pointer-events:none;
  }
  .bg-base{
    background:
      radial-gradient(circle at 20% 15%, rgba(201,167,107,0.06), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(201,167,107,0.07), transparent 45%),
      radial-gradient(circle at 50% 50%, rgba(255,255,255,0.02), transparent 60%),
      linear-gradient(160deg, var(--bg-deep) 0%, var(--bg-deep-2) 55%, #091d19 100%);
  }
  .bg-noise{
    opacity:0.5;
    background-image:
      repeating-linear-gradient(45deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px),
      repeating-linear-gradient(-45deg, rgba(0,0,0,0.08) 0px, rgba(0,0,0,0.08) 1px, transparent 1px, transparent 3px);
    mix-blend-mode:overlay;
  }
  .brush{
    position:fixed; width:min(55vw, 340px); height:auto; opacity:0.85; z-index:1; pointer-events:none;
    filter: drop-shadow(0 0 25px rgba(0,0,0,0.25));
  }
  .brush.tl{ top:-6%; left:-10%; transform: rotate(-8deg); }
  .brush.br{ bottom:-8%; right:-10%; transform: rotate(176deg); }

  /* ---------- Stage ---------- */
  .stage{
    position:relative; z-index:2;
    width:100%; height:100%;
    min-height:100vh; min-height:100dvh;
    padding: 24px;
  }

  /* ---------- Closed card ---------- */
  .closed-card{
    position:absolute;
    top:50%; left:50%;
    transform: translate(-50%,-50%);
    width:min(84vw, 320px);
    aspect-ratio: 3/4.6;
    border:1px solid rgba(201,167,107,0.55);
    border-radius:6px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px;
    cursor:pointer;
    background:
      radial-gradient(circle at 50% 30%, rgba(201,167,107,0.08), transparent 60%),
      linear-gradient(180deg, rgba(201,167,107,0.03), rgba(0,0,0,0.15));
    box-shadow:
      0 0 0 1px rgba(201,167,107,0.15),
      inset 0 0 40px rgba(201,167,107,0.06),
      0 20px 60px rgba(0,0,0,0.45);
    transition: transform .5s cubic-bezier(.22,.9,.32,1), opacity .6s ease, filter .6s ease;
    -webkit-user-select:none; user-select:none;
  }
  .closed-card::before{
    content:"";
    position:absolute; inset:10px;
    border:1px solid rgba(201,167,107,0.35);
    border-radius:3px;
    pointer-events:none;
  }
  .closed-card .corner{
    position:absolute; width:26px; height:26px; opacity:0.8;
  }
  .closed-card .corner svg{ width:100%; height:100%; }
  .closed-card .corner.c-tl{ top:6px; left:6px; transform:rotate(0deg); }
  .closed-card .corner.c-tr{ top:6px; right:6px; transform:scaleX(-1); }
  .closed-card .corner.c-bl{ bottom:6px; left:6px; transform:scaleY(-1); }
  .closed-card .corner.c-br{ bottom:6px; right:6px; transform:scale(-1,-1); }

  .seal{
    width:64px; height:64px;
    border-radius:50%;
    border:1px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
    position:relative;
    box-shadow:0 0 18px rgba(201,167,107,0.25), inset 0 0 12px rgba(201,167,107,0.15);
  }
  .seal::before{
    content:"";
    position:absolute; inset:6px;
    border:1px solid rgba(201,167,107,0.5);
    border-radius:50%;
  }
  .seal svg{ width:26px; height:26px; }

  .closed-title{
    font-family:'Aref Ruqaa', serif;
    font-weight:700;
    font-size:2.3rem;
    color: var(--gold-light);
    letter-spacing:1px;
    text-shadow: 0 0 18px rgba(201,167,107,0.35);
  }
  .closed-sub{
    font-size:0.78rem;
    letter-spacing:2px;
    color: rgba(232,210,166,0.65);
  }
  .tap-hint{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    margin-top:6px;
  }
  .tap-icon{
    width:30px; height:30px;
    animation: tapPulse 1.8s ease-in-out infinite;
  }
  .tap-text{
    font-size:0.72rem;
    letter-spacing:1px;
    color: rgba(232,210,166,0.75);
  }
  @keyframes tapPulse{
    0%,100%{ transform: scale(1) translateY(0); opacity:0.55; }
    50%{ transform: scale(1.12) translateY(-2px); opacity:1; }
  }

  .closed-card.opening{
    transform: translate(-50%,-50%) scale(1.06);
    filter: brightness(1.15);
  }
  .closed-card.hidden-card{
    opacity:0;
    transform: translate(-50%,-50%) scale(1.5);
    pointer-events:none;
  }

  /* ---------- Invite content ---------- */
  .invite{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    overflow-y:auto;
    text-align:center;
    opacity:0;
    visibility:hidden;
    scrollbar-width:none;
  }
  .invite::-webkit-scrollbar{ display:none; }
  .invite.show{
    opacity:1;
    visibility:visible;
  }
  .invite-inner{
    width:min(88vw, 380px);
    padding: 34px 22px 60px;
    margin:auto 0;
  }

  .reveal{
    opacity:0;
    transform: translateY(16px);
    transition: opacity .9s ease, transform .9s ease;
  }
  .invite.show .reveal{
    opacity:1;
    transform:translateY(0);
  }
  .invite.show .r1{ transition-delay:.15s; }
  .invite.show .r2{ transition-delay:.35s; }
  .invite.show .r3{ transition-delay:.55s; }
  .invite.show .r4{ transition-delay:.75s; }
  .invite.show .r5{ transition-delay:.95s; }
  .invite.show .r6{ transition-delay:1.15s; }
  .invite.show .r7{ transition-delay:1.35s; }
  .invite.show .r8{ transition-delay:1.55s; }
  .invite.show .r9{ transition-delay:1.75s; }

  .top-word{
    font-family:'Aref Ruqaa', serif;
    font-weight:700;
    font-size:2.1rem;
    color: var(--gold-light);
    margin-bottom:6px;
  }
  .gold-shimmer{
    background: linear-gradient(100deg,
      var(--gold-light) 30%, #fff6df 45%, var(--gold-light) 60%);
    background-size: 220% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation: shimmer 3.2s ease-in-out 2.4s 1;
  }
  @keyframes shimmer{
    0%{ background-position: 140% 0; }
    60%{ background-position: -40% 0; }
    100%{ background-position: -40% 0; }
  }

  .calligraphy-line{
    font-family:'Aref Ruqaa', serif;
    font-size:1.15rem;
    line-height:1.9;
    color: var(--gold);
    margin: 10px auto 18px;
    max-width:300px;
  }
  .body-text{
    font-family:'Tajawal', sans-serif;
    font-weight:300;
    font-size:0.95rem;
    color: rgba(232,210,166,0.85);
    line-height:1.9;
    margin: 6px 0;
  }
  .divider{
    width:56px; height:1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 20px auto;
  }
  .big-title{
    font-family:'Aref Ruqaa', serif;
    font-weight:700;
    font-size:2.6rem;
    margin: 6px 0 16px;
    letter-spacing:1px;
  }

  .info-block{
    display:flex;
    align-items:stretch;
    justify-content:center;
    gap:22px;
    margin: 26px auto 8px;
    max-width:340px;
  }
  .info-col{
    flex:1;
    display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .info-divider{
    width:1px;
    background: linear-gradient(180deg, transparent, rgba(201,167,107,0.6), transparent);
  }
  .info-icon{ width:24px; height:24px; }
  .info-label{
    font-size:0.9rem;
    color: var(--gold-light);
    font-weight:500;
  }
  .info-sub{
    font-size:0.85rem;
    color: rgba(232,210,166,0.7);
    font-weight:300;
  }

  .host-label{
    font-size:0.8rem;
    letter-spacing:3px;
    color: rgba(232,210,166,0.55);
    margin-top:22px;
  }
  .host-name{
    font-family:'Aref Ruqaa', serif;
    font-size:1.5rem;
    color: var(--gold-light);
    margin-top:6px;
  }
  .closing-line{
    font-family:'Aref Ruqaa', serif;
    font-size:1.05rem;
    color: var(--gold);
    margin-top:26px;
    line-height:1.8;
  }

  @media (max-width:340px){
    .big-title{ font-size:2.1rem; }
    .top-word{ font-size:1.8rem; }
  }
</style>
</head>
<body>

  <div class="bg-layer bg-base"></div>
  <div class="bg-layer bg-noise"></div>

  <svg class="brush tl" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
    <path d="M10,150 C40,60 120,10 200,20 C170,40 150,70 160,100 C110,90 70,110 60,150 C90,140 120,150 130,180 C90,190 50,190 30,220 C50,210 70,215 80,230 C50,250 20,230 10,150 Z"
      fill="#C9A76B" opacity="0.5"/>
  </svg>
  <svg class="brush br" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
    <path d="M10,150 C40,60 120,10 200,20 C170,40 150,70 160,100 C110,90 70,110 60,150 C90,140 120,150 130,180 C90,190 50,190 30,220 C50,210 70,215 80,230 C50,250 20,230 10,150 Z"
      fill="#C9A76B" opacity="0.5"/>
  </svg>

  <div class="stage">

    <div class="closed-card" id="closedCard" role="button" tabindex="0" aria-label="اضغط لفتح الدعوة">
      <div class="corner c-tl"><svg viewBox="0 0 26 26"><path d="M1,1 L1,10 M1,1 L10,1" stroke="#C9A76B" stroke-width="1" fill="none"/></svg></div>
      <div class="corner c-tr"><svg viewBox="0 0 26 26"><path d="M1,1 L1,10 M1,1 L10,1" stroke="#C9A76B" stroke-width="1" fill="none"/></svg></div>
      <div class="corner c-bl"><svg viewBox="0 0 26 26"><path d="M1,1 L1,10 M1,1 L10,1" stroke="#C9A76B" stroke-width="1" fill="none"/></svg></div>
      <div class="corner c-br"><svg viewBox="0 0 26 26"><path d="M1,1 L1,10 M1,1 L10,1" stroke="#C9A76B" stroke-width="1" fill="none"/></svg></div>

      <div class="seal">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2 L12 22 M4 8 C8 6 16 6 20 8 M4 16 C8 18 16 18 20 16" stroke="#C9A76B" stroke-width="1.1" stroke-linecap="round"/>
        </svg>
      </div>

      <div class="closed-title">دعوة</div>
      <div class="closed-sub">زفاف</div>

      <div class="tap-hint">
        <svg class="tap-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 11.5V6a1.5 1.5 0 0 1 3 0v4.2M12 10.2V4.5a1.5 1.5 0 0 1 3 0V11M15 5.8a1.5 1.5 0 0 1 3 0V12M18 8.5a1.5 1.5 0 0 1 3 0V14c0 4.5-3 8-7 8s-6-2-7.5-5L4.8 14a1.6 1.6 0 0 1 2.6-1.8L9 14"
            stroke="#E8D2A6" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="tap-text">اضغط لفتح الدعوة</div>
      </div>
    </div>

    <div class="invite" id="invite">
     <div class="invite-inner">

      <div class="reveal r1 top-word gold-shimmer">دعوة</div>

      <div class="reveal r2 calligraphy-line">
        بارك الله لهما وبارك عليهما<br>وجمع بينهما في خير
      </div>

      <div class="reveal r3 body-text">
        بكل الحب والتقدير أتشرف بدعوتكم لحضور
      </div>

      <div class="reveal r4 big-title gold-shimmer">حفل زواجي</div>

      <div class="reveal r5 body-text">
        وتناول طعام العشاء وذلك بمشيئة الله
      </div>

      <div class="reveal r6 divider"></div>

      <div class="reveal r6 info-block">
        <div class="info-col">
          <svg class="info-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 21s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12Z" stroke="#C9A76B" stroke-width="1.1"/>
            <circle cx="12" cy="9" r="2.4" stroke="#C9A76B" stroke-width="1.1"/>
          </svg>
          <div class="info-label">قاعة يارا</div>
          <div class="info-sub">للإحتفالات</div>
        </div>
        <div class="info-divider"></div>
        <div class="info-col">
          <svg class="info-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3.5" y="5" width="17" height="15.5" rx="1.5" stroke="#C9A76B" stroke-width="1.1"/>
            <path d="M3.5 9.5h17M8 3v3.5M16 3v3.5" stroke="#C9A76B" stroke-width="1.1" stroke-linecap="round"/>
          </svg>
          <div class="info-label">يوم السبت</div>
          <div class="info-sub">١٧ أكتوبر ٢٠٢٦ م</div>
        </div>
      </div>

      <div class="reveal r7 host-label">الداعي</div>
      <div class="reveal r7 host-name">عبدالله محمد عمر العمودي</div>

      <div class="reveal r8 closing-line">
        وحضوركم كريم لنا الفرح والسرور
      </div>

     </div>
    </div>

  </div>

<script>
  (function(){
    var closedCard = document.getElementById('closedCard');
    var invite = document.getElementById('invite');
    var opened = false;

    function openInvite(){
      if(opened) return;
      opened = true;
      closedCard.classList.add('opening');
      setTimeout(function(){
        closedCard.classList.add('hidden-card');
        invite.classList.add('show');
      }, 380);
    }

    closedCard.addEventListener('click', openInvite);
    closedCard.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){
        e.preventDefault();
        openInvite();
      }
    });
  })();
</script>

</body>
</html>
