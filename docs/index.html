<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>دعوة زفاف عبدالله</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Markazi+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #F8F2E4;
    --cream-panel: #FBF7EC;
    --maroon: #7C1E3B;
    --maroon-deep: #5A1329;
    --olive: #5B6B49;
    --olive-deep: #3E4A33;
    --gold: #C9A15E;
    --gold-soft: #DDBB84;
    --text-brown: #4A3A2A;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background: var(--cream);
    overflow:hidden;
    font-family:'Markazi Text', serif;
  }
  body{
    min-height:100vh;
    min-height:100dvh;
    position:relative;
    color: var(--text-brown);
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }

  /* ================= CLOSED SCREEN ================= */
  .closed-screen{
    position:fixed; inset:0; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:28px;
    background:
      radial-gradient(ellipse 90% 60% at 50% 0%, rgba(255,255,255,0.06), transparent 55%),
      linear-gradient(160deg, var(--olive) 0%, var(--olive-deep) 100%);
    transition: opacity .6s ease, transform .6s cubic-bezier(.3,.8,.4,1);
    cursor:pointer;
    -webkit-user-select:none; user-select:none;
  }
  .closed-screen.hidden-screen{
    opacity:0;
    transform: scale(1.05);
    pointer-events:none;
  }

  .leaf-branch{
    position:absolute; top:0; height:100%; width:auto;
    opacity:0.9;
  }
  .leaf-branch.left{ left:0; }
  .leaf-branch.right{ right:0; transform:scaleX(-1); }

  .pill-btn{
    display:flex; align-items:center; gap:8px;
    background: var(--maroon-deep);
    color: var(--cream);
    font-family:'Markazi Text', serif;
    font-weight:600;
    font-size:1.05rem;
    padding: 11px 26px;
    border-radius: 999px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    letter-spacing:0.5px;
    z-index:1;
  }
  .pill-btn svg{ width:15px; height:15px; }

  .closed-tagline{
    font-family:'Aref Ruqaa', serif;
    font-weight:700;
    font-size:2.1rem;
    color: var(--cream);
    text-shadow: 0 2px 12px rgba(0,0,0,0.25);
    z-index:1;
  }

  .medallion-btn{
    width:110px; height:110px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #f0d9a8, var(--gold) 55%, #a97c3f 100%);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35), inset 0 2px 6px rgba(255,255,255,0.4);
    animation: medallionFloat 3.2s ease-in-out infinite;
    z-index:1;
  }
  .medallion-btn svg{ width:38px; height:38px; }
  @keyframes medallionFloat{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(-6px); }
  }

  /* ================= LIGHT BURST ================= */
  .burst{
    position:fixed; top:50%; left:50%;
    width:10px; height:10px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(248,242,228,0.95) 0%, rgba(201,161,94,0.5) 40%, rgba(201,161,94,0) 70%);
    transform:translate(-50%,-50%) scale(1);
    opacity:0;
    pointer-events:none;
    z-index:11;
  }
  .burst.fire{
    animation: burstOut 1s cubic-bezier(.15,.8,.3,1) forwards;
  }
  @keyframes burstOut{
    0%{ opacity:0; transform:translate(-50%,-50%) scale(1); }
    25%{ opacity:1; }
    100%{ opacity:0; transform:translate(-50%,-50%) scale(60); }
  }

  /* ================= OPENED INVITE ================= */
  .frame{
    position:fixed; inset:14px;
    border:1.5px solid var(--gold);
    border-radius:16px;
    pointer-events:none;
    z-index:2;
  }
  .sparkle{
    position:fixed; width:14px; height:14px; z-index:3; opacity:0.9;
  }
  .sparkle.s-tl{ top:26px; left:26px; }
  .sparkle.s-br{ bottom:26px; right:26px; }

  .invite{
    position:fixed;
    inset:0;
    z-index:1;
    height:100vh;
    height:100dvh;
    overflow-y:auto;
    display:flex;
    justify-content:center;
    text-align:center;
    scrollbar-width:none;
  }
  .invite::-webkit-scrollbar{ display:none; }

  .floral{
    position:fixed; width:min(50vw, 230px); height:auto; z-index:0; opacity:0.95;
  }
  .floral.tr{ top:-4%; right:-8%; }
  .floral.bl{ bottom:-4%; left:-8%; transform:rotate(180deg); }

  .invite-inner{
    position:relative;
    width:min(86vw, 360px);
    padding: 56px 20px 60px;
    margin:auto;
  }

  .reveal{
    opacity:0;
    transform: translateY(14px);
    transition: opacity .8s ease, transform .8s ease;
  }
  .invite.show .reveal{ opacity:1; transform:translateY(0); }
  .invite.show .r1{ transition-delay:.1s; }
  .invite.show .r2{ transition-delay:.28s; }
  .invite.show .r3{ transition-delay:.46s; }
  .invite.show .r4{ transition-delay:.64s; }
  .invite.show .r5{ transition-delay:.82s; }
  .invite.show .r6{ transition-delay:1.0s; }
  .invite.show .r7{ transition-delay:1.18s; }
  .invite.show .r8{ transition-delay:1.36s; }

  .top-badge{
    display:inline-flex; align-items:center; gap:7px;
    background: var(--maroon-deep);
    color: var(--cream);
    font-family:'Markazi Text', serif;
    font-weight:600;
    font-size:1rem;
    padding: 8px 22px;
    border-radius:999px;
    box-shadow: 0 6px 16px rgba(90,19,41,0.3);
    margin-bottom:22px;
  }
  .top-badge svg{ width:13px; height:13px; }

  .calligraphy-line{
    font-family:'Aref Ruqaa', serif;
    font-size:1.25rem;
    line-height:1.9;
    color: var(--maroon);
    margin: 4px auto 18px;
    max-width:290px;
  }
  .body-text{
    font-family:'Markazi Text', serif;
    font-weight:500;
    font-size:1.2rem;
    color: var(--text-brown);
    line-height:1.7;
    margin: 6px 0;
  }
  .divider{
    display:flex; align-items:center; justify-content:center; gap:9px;
    margin: 20px auto;
  }
  .divider .line{
    width:40px; height:1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .divider svg{ width:14px; height:14px; }
  .big-title{
    font-family:'Aref Ruqaa', serif;
    font-weight:700;
    font-size:2.9rem;
    color: var(--maroon);
    margin: 10px 0 16px;
  }

  .info-box{
    position:relative;
    margin: 24px auto 6px;
    padding: 26px 20px 22px;
    background: var(--cream-panel);
    border:1px solid rgba(201,161,94,0.5);
    border-radius:14px;
  }
  .info-weekday{
    font-family:'Markazi Text', serif;
    font-weight:600;
    font-size:1.1rem;
    color: var(--olive-deep);
    letter-spacing:1px;
    margin-bottom:14px;
  }
  .date-row{
    display:flex; align-items:center; justify-content:center; gap:16px;
  }
  .date-side{
    font-family:'Markazi Text', serif;
    font-weight:600;
    font-size:1.15rem;
    color: var(--maroon);
  }
  .date-medal{
    width:78px; height:78px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #a23256, var(--maroon) 60%, var(--maroon-deep) 100%);
    display:flex; align-items:center; justify-content:center;
    color: var(--cream);
    font-family:'Markazi Text', serif;
    font-weight:700;
    font-size:2rem;
    box-shadow: 0 8px 18px rgba(90,19,41,0.3);
    flex-shrink:0;
  }
  .info-divider2{
    width:80%; height:1px;
    margin: 18px auto;
    background: linear-gradient(90deg, transparent, rgba(201,161,94,0.6), transparent);
  }
  .location-row{
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .location-row svg{ width:19px; height:19px; flex-shrink:0; }
  .location-text{
    font-family:'Markazi Text', serif;
    font-weight:600;
    font-size:1.2rem;
    color: var(--maroon);
  }

  .host-label{
    font-size:0.95rem;
    letter-spacing:3px;
    color: rgba(74,58,42,0.6);
    margin-top:26px;
  }
  .host-name{
    font-family:'Aref Ruqaa', serif;
    font-size:1.7rem;
    color: var(--maroon);
    margin-top:8px;
  }
  .closing-line{
    font-family:'Aref Ruqaa', serif;
    font-size:1.2rem;
    color: var(--olive-deep);
    margin-top:30px;
    line-height:1.8;
  }

  @media (max-width:340px){
    .big-title{ font-size:2.4rem; }
    .medallion-btn{ width:92px; height:92px; }
  }
</style>
</head>
<body>

  <div class="frame"></div>
  <svg class="sparkle s-tl" viewBox="0 0 24 24"><path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z" fill="#C9A15E"/></svg>
  <svg class="sparkle s-br" viewBox="0 0 24 24"><path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z" fill="#C9A15E"/></svg>

  <svg class="floral tr" viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg">
    <path d="M255,5 C220,20 200,45 195,80 C190,115 165,130 140,150 C120,166 110,190 112,220"
      fill="none" stroke="#C9A15E" stroke-width="1.6"/>
    <g transform="translate(195,80) rotate(20)">
      <path d="M0,0 C8,-20 30,-20 38,0 C30,14 8,14 0,0 Z" fill="#6B7A57"/>
      <path d="M4,0 C12,-4 26,-4 34,0" stroke="#4E5C3E" stroke-width="0.8" fill="none"/>
    </g>
    <g transform="translate(150,140) rotate(-30) scale(0.9)">
      <path d="M0,0 C8,-20 30,-20 38,0 C30,14 8,14 0,0 Z" fill="#6B7A57"/>
      <path d="M4,0 C12,-4 26,-4 34,0" stroke="#4E5C3E" stroke-width="0.8" fill="none"/>
    </g>
    <g transform="translate(215,45)">
      <ellipse rx="15" ry="8" fill="#FFFDF8" stroke="#C9A15E" stroke-width="0.8"/>
      <ellipse rx="15" ry="8" fill="#FFFDF8" stroke="#C9A15E" stroke-width="0.8" transform="rotate(45)"/>
      <ellipse rx="15" ry="8" fill="#FFFDF8" stroke="#C9A15E" stroke-width="0.8" transform="rotate(90)"/>
      <ellipse rx="15" ry="8" fill="#FFFDF8" stroke="#C9A15E" stroke-width="0.8" transform="rotate(135)"/>
      <circle r="5" fill="#C9A15E"/>
    </g>
    <g transform="translate(120,205) scale(0.8)">
      <ellipse rx="15" ry="8" fill="#FFFDF8" stroke="#C9A15E" stroke-width="0.8"/>

      <ellipse rx="15" ry="8" fill="#FFFDF8" stroke="#C9A15E" stroke-width="0.8" transform="rotate(90)"/>
      <ellipse rx="15" ry="8" fill="#FFFDF8" stroke="#C9A15E" stroke-width="0.8" transform="rotate(135)"/>
      <circle r="5" fill="#C9A15E"/>
    </g>
  </svg>

  <svg class="floral bl" viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg">
    <path d="M255,5 C220,20 200,45 195,80 C190,115 165,130 140,150 C120,166 110,190 112,220"
      fill="none" stroke="#C9A15E" stroke-width="1.6"/>
    <g transform="translate(195,80) rotate(20)">
      <path d="M0,0 C8,-20 30,-20 38,0 C30,14 8,14 0,0 Z" fill="#6B7A57"/>
      <path d="M4,0 C12,-4 26,-4 34,0" stroke="#4E5C3E" stroke-width="0.8" fill="none"/>
    </g>
    <g transform="translate(150,140) rotate(-30) scale(0.9)">
      <path d="M0,0 C8,-20 30,-20 38,0 C30,14 8,14 0,0 Z" fill="#6B7A57"/>
      <path d="M4,0 C12,-4 26,-4 34,0" stroke="#4E5C3E" stroke-width="0.8" fill="none"/>
    </g>
    <g transform="translate(215,45)">
      <ellipse rx="15" ry="8" fill="#FFFDF8" stroke="#C9A15E" stroke-width="0.8"/>
      <ellipse rx="15" ry="8" fill="#FFFDF8" stroke="#C9A15E" stroke-width="0.8" transform="rotate(45)"/>
      <ellipse rx="15" ry="8" fill="#FFFDF8" stroke="#C9A15E" stroke-width="0.8" transform="rotate(90)"/>
      <ellipse rx="15" ry="8" fill="#FFFDF8" stroke="#C9A15E" stroke-width="0.8" transform="rotate(135)"/>
      <circle r="5" fill="#C9A15E"/>
    </g>
    <g transform="translate(120,205) scale(0.8)">
      <ellipse rx="15" ry="8" fill="#FFFDF8" stroke="#C9A15E" stroke-width="0.8"/>
      <ellipse rx="15" ry="8" fill="#FFFDF8" stroke="#C9A15E" stroke-width="0.8" transform="rotate(45)"/>
      <ellipse rx="15" ry="8" fill="#FFFDF8" stroke="#C9A15E" stroke-width="0.8" transform="rotate(90)"/>
      <ellipse rx="15" ry="8" fill="#FFFDF8" stroke="#C9A15E" stroke-width="0.8" transform="rotate(135)"/>
      <circle r="5" fill="#C9A15E"/>
    </g>
  </svg>

  <div class="invite" id="invite">
    <div class="invite-inner">

      <div class="reveal r1 top-badge">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#F8F2E4" stroke-width="1.3"/></svg>
        دعوة
      </div>

      <div class="reveal r2 calligraphy-line">
        بارك الله لهما وبارك عليهما<br>وجمع بينهما في خير
      </div>

      <div class="reveal r3 body-text">
        بكل الحب والتقدير أتشرف بدعوتكم لحضور
      </div>

      <div class="reveal r4 big-title">حفل زواجي</div>

      <div class="reveal r5 body-text">
        وتناول طعام العشاء وذلك بمشيئة الله
      </div>

      <div class="reveal r6 divider">
        <span class="line"></span>
        <svg viewBox="0 0 24 24"><path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z" fill="#C9A15E"/></svg>
        <span class="line"></span>
      </div>

      <div class="reveal r6 info-box">
        <div class="info-weekday">يوم السبت</div>
        <div class="date-row">
          <div class="date-side">أكتوبر</div>
          <div class="date-medal">١٧</div>
          <div class="date-side">٢٠٢٦ م</div>
        </div>
        <div class="info-divider2"></div>
        <div class="location-row">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 21s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12Z" stroke="#7C1E3B" stroke-width="1.2"/>
            <circle cx="12" cy="9" r="2.4" stroke="#7C1E3B" stroke-width="1.2"/>
          </svg>
          <div class="location-text">قاعة يارا للإحتفالات</div>
        </div>
      </div>

      <div class="reveal r7 host-label">الداعي</div>
      <div class="reveal r7 host-name">عبدالله محمد عمر العمودي</div>

      <div class="reveal r8 closing-line">
        وحضوركم كريم لنا الفرح والسرور
      </div>

    </div>
  </div>

  <div class="closed-screen" id="closedScreen" role="button" tabindex="0" aria-label="اضغط لفتح الدعوة">
    <svg class="leaf-branch left" viewBox="0 0 120 640" xmlns="http://www.w3.org/2000/svg">
      <path d="M20,0 C24,120 10,220 22,320 C32,400 16,500 24,640" fill="none" stroke="#C9A15E" stroke-width="1.4" opacity="0.85"/>
      <g stroke="#C9A15E" stroke-width="1.2" fill="none" opacity="0.85">
        <path d="M20,90 C40,80 55,90 58,108 C42,112 26,106 20,90 Z"/>
        <path d="M22,180 C4,172 -8,180 -10,198 C4,204 20,198 22,180 Z"/>
        <path d="M16,270 C36,262 51,272 54,290 C38,294 22,288 16,270 Z"/>
        <path d="M24,360 C6,352 -6,360 -8,378 C6,384 22,378 24,360 Z"/>
        <path d="M18,450 C38,442 53,452 56,470 C40,474 24,468 18,450 Z"/>
        <path d="M24,540 C6,532 -6,540 -8,558 C6,564 22,558 24,540 Z"/>
      </g>
    </svg>
    <svg class="leaf-branch right" viewBox="0 0 120 640" xmlns="http://www.w3.org/2000/svg">
      <path d="M20,0 C24,120 10,220 22,320 C32,400 16,500 24,640" fill="none" stroke="#C9A15E" stroke-width="1.4" opacity="0.85"/>
      <g stroke="#C9A15E" stroke-width="1.2" fill="none" opacity="0.85">
        <path d="M20,90 C40,80 55,90 58,108 C42,112 26,106 20,90 Z"/>
        <path d="M22,180 C4,172 -8,180 -10,198 C4,204 20,198 22,180 Z"/>
        <path d="M16,270 C36,262 51,272 54,290 C38,294 22,288 16,270 Z"/>
        <path d="M24,360 C6,352 -6,360 -8,378 C6,384 22,378 24,360 Z"/>
        <path d="M18,450 C38,442 53,452 56,470 C40,474 24,468 18,450 Z"/>
        <path d="M24,540 C6,532 -6,540 -8,558 C6,564 22,558 24,540 Z"/>
      </g>
    </svg>

    <div class="pill-btn">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z" fill="#F8F2E4"/></svg>
      اضغط لفتح الدعوة
    </div>

    <div class="closed-tagline">دعوة</div>

    <div class="medallion-btn">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="16" cy="20" r="10" stroke="#5A1329" stroke-width="2"/>
        <circle cx="26" cy="20" r="10" stroke="#5A1329" stroke-width="2"/>
      </svg>
    </div>
  </div>

  <div class="burst" id="burst"></div>

<script>
  (function(){
    var closedScreen = document.getElementById('closedScreen');
    var invite = document.getElementById('invite');
    var burst = document.getElementById('burst');
    var opened = false;

    function openInvite(){
      if(opened) return;
      opened = true;
      burst.classList.add('fire');
      closedScreen.classList.add('hidden-screen');
      setTimeout(function(){
        invite.classList.add('show');
      }, 150);
    }

    closedScreen.addEventListener('click', openInvite);
    closedScreen.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){
        e.preventDefault();
        openInvite();
      }
    });
  })();
</script>

</body>
</html>
